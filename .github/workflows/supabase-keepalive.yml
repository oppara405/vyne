name: supabase-keepalive
on:
  schedule:
    - cron: "17 3,15 * * *"   # 1日2回、DBに読み取りクエリ（UTC）
    - cron: "0 0 1 * *"       # 毎月1日: リポジトリのheartbeat（下記の落とし穴2の対策）
  workflow_dispatch:           # 手動実行ボタン（動作確認用）

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read global_marks (read only)
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/global_marks?select=id&id=eq.1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"

  heartbeat:
    if: github.event.schedule == '0 0 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u > .github/keepalive.txt
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "chore: keepalive" && git push