<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blob Network v4.1 — Low-bit / Sand Edition</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent;}
  #root{position:relative;width:100%;height:100%;}
  #goo{position:absolute;inset:0;width:100%;height:100%;display:block;}
  svg{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;}
  svg.used{cursor:default;}
  #letters{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
  #letters span{position:absolute;transform:translate(-50%,-50%);line-height:1;white-space:pre;}
  #letters span.clx{animation:vyneBlink var(--d,.15s) steps(1) infinite;animation-delay:var(--dl,0s);}
  @keyframes vyneBlink{50%{visibility:hidden}}
</style>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400&display=swap" rel="stylesheet">

<!-- ============================================================
     HUDバーのスタイル（★カスタマイズはこのブロックを編集★）
     iframe内のため、サイト側CSSからは上書きできません。
     ============================================================ -->
<style id="hud-style">
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono&display=swap');
  #bar{
    position:absolute; left:0; right:0; bottom:0;
    display:flex;
    padding:10px 40px;              /* PC */
    justify-content:space-between;
    align-items:flex-start;
    align-self:stretch;
    pointer-events:none;
    box-sizing:border-box;
  }
  @media (max-width:768px){
    #bar{ padding:10px 20px; }      /* Mobile */
  }
  #bar .txt{
    color:#FFF;
    background:#000;                /* テキストエリア背景 */
    font-family:"Space Mono",Consolas,monospace;
    font-size:10px;
    font-style:normal;
    font-weight:400;
    line-height:normal;
    letter-spacing:1.8px;
    padding:3px 6px;
    white-space:pre;
  }
</style>
</head>
<body>
<div id="root">
  <canvas id="goo"></canvas><!-- グーイ描画: WebGL(GPU) -->
  <div id="letters"></div><!-- 別レイヤー: V/Y/N/E のランダム文字 -->
  <svg id="svg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice"></svg><!-- 線+HUD: フィルター無しSVG(軽量) -->
  <div id="bar" style="display:none">
    <div class="txt" id="barL"></div>
    <div class="txt" id="barR"></div>
  </div>
</div>
<!-- Supabase JS (CDN) — 読み込み失敗してもローカルモードで動作します -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script>
"use strict";
/* ============================================================
 * BLOB NETWORK v4.1 — LOW-BIT / SAND Edition
 *
 * WebGL版をベースに、blobの「描き方」だけを差し替えたアートディレクション版。
 * 座標・接続線・HUD・クリック/同期ロジックは main と同一。
 *   ・論理座標に固定した粗いドットグリッド（art.pixel）で場を評価 → ロービット
 *   ・輪郭はディザで外側へ砂粒のように散らす（art.scatter）
 *   ・粒はコマごとに少しざわつく（art.shimmer / art.grainFps）
 *   ・色: 背景=青 / blob輪郭=青寄り → 中心=緑（段階量子化＋ディザ）
 *   ・盛り上がり: blob座標が密集した場所がキーカラー(オレンジ)に変化（art.hot*）
 *   ・別レイヤー: V/Y/N/E の文字がランダムな位置に現れては消える（letters）
 * ============================================================ */
const CFG=window.BLOB_CONFIG||{};
const P=Object.assign({
  w:1200,h:700,
  blur:14,contrast:28,opacity:1,minR:14,maxR:80,speed:50,pulse:0.3,
  lnOn:true,lnDist:320,lnW:1.5,lnC:'#1c1e22',lnA:0.7,
  hudMarker:true,hudCoords:true,hudId:true,hudSize:11,hudC:'#1c1e22',
},CFG.params||{});
const ART=Object.assign({
  bg:'hsl(228,83%,44%)',edge:'hsl(200,83%,44%)',core:'hsl(140,83%,44%)',hot:'#E73600',
  pixel:8,steps:4,scatter:0.6,shimmer:0.35,grainFps:10,
  hotRadius:90,hotMin:2.0,hotMax:3.2,hotSpill:0.2,
  bgNoise:0.2,noiseColor:null,noisePixel:null,noiseFps:null,bgShape:0,noiseLineLen:[3,20],
},CFG.art||{});
/* 盛り上がり（オレンジ箇所）に高速で出る文字 */
const HLET=Object.assign({on:true,interval:[0.04,0.18],life:[0.15,0.5],max:30},CFG.hotLetters||{});
/* クライマックス（グリッチ＋反転 → 飛散） */
const CLX=Object.assign({
  on:true,requireClick:true,minBlobs:10,holdSec:3,durationSec:2,keep:8,hideSec:30,cooldownSec:10,
  letters:26,letterColors:['#ffffff','#000000'],
},CFG.climax||{});
const LET=Object.assign({
  on:true,chars:'VYNE',color:'#000000',font:'"Open Sans","Helvetica Neue",Arial,sans-serif',
  size:'clamp(28px,4.2vw,64px)',weight:400,interval:[0.6,2.0],life:[1.2,3.5],max:6,
},CFG.letters||{});
const SEL=Object.assign({bg:'#000000',text:'#ffffff'},CFG.selection||{});
const IS_MOBILE=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||/iPhone|iPad|Android/i.test(navigator.userAgent);
const PERF=Object.assign({pcFps:60,mobileFps:60,mobileBlurScale:1,mobileMaxBlobs:50},CFG.perf||{});
const INIT_BLOBS=(CFG.initial&&typeof CFG.initial.initialBlobs==='number')?Math.max(0,CFG.initial.initialBlobs):null;
const HARD_CAP=50;
const MAX=Math.min(CFG.maxBlobs||40,HARD_CAP,IS_MOBILE?PERF.mobileMaxBlobs:HARD_CAP);
const SVGNS='http://www.w3.org/2000/svg';
const svg=document.getElementById('svg');
const bar=document.getElementById('bar'), barL=document.getElementById('barL'), barR=document.getElementById('barR');

/* ---------- client id ---------- */
let myId;
try{
  myId=localStorage.getItem('blobClientId');
  if(!myId){myId=(crypto.randomUUID?crypto.randomUUID():'c'+Math.random().toString(36).slice(2));localStorage.setItem('blobClientId',myId)}
}catch(e){myId='c'+Math.random().toString(36).slice(2)}

/* ============================================================
 * WebGL レンダラー（グーイ本体・GPU実行）
 * ============================================================ */
const canvas=document.getElementById('goo');
let gl=null,glProg=null,glU={},HAS_GL=false;
const DPR=Math.min(window.devicePixelRatio||1,2);
/* メタボールは有限半径カーネル (1-(d/R)^2)^2 を使用。R = r × MERGE_K が影響半径 */
const MERGE_K=1.6+P.blur/25;                                   // blur → 融合の届く距離
const THRESH=Math.pow(1-1/(MERGE_K*MERGE_K),2);                // 単独blobの輪郭がちょうど半径rになるしきい値
/* CSS色（#hex / hsl() / 色名）→ [r,g,b] 0..1 */
const _cx=document.createElement('canvas').getContext('2d');
function css2hex(c){_cx.fillStyle='#000';_cx.fillStyle=c;return _cx.fillStyle}
function css2rgb(c){const n=parseInt(css2hex(c).slice(1),16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]}
function hueOf(c){
  const [r,g,b]=css2rgb(c),mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
  if(!d)return 0;
  const h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;
  return (h*60+360)%360;
}
/* 背景ノイズ色: 未指定なら背景色の色相で「ごく薄く色味のあるグレー」を自動生成（青→ #7682B2 付近） */
const NOISE_COLOR=ART.noiseColor||`hsl(${hueOf(ART.bg).toFixed(1)},28%,58%)`;

function initGL(){
  try{
    gl=canvas.getContext('webgl',{antialias:false,alpha:false,depth:false,stencil:false,preserveDrawingBuffer:false})
      ||canvas.getContext('experimental-webgl');
  }catch(e){gl=null}
  if(!gl){console.warn('[blob] WebGL利用不可 → SVGフォールバック描画');return false}
  const vs=`attribute vec2 aP;void main(){gl_Position=vec4(aP,0.,1.);}`;
  const fs=`#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 uRes,uOffset;
uniform float uScale,uMergeK,uThresh,uOpacity;
uniform float uPix,uSteps,uScatter,uShimmer,uSeed,uHotR,uHotMin,uHotMax,uHotSpill;
uniform int uCount;
uniform vec3 uBlobs[${HARD_CAP}];
uniform vec3 uEdge,uCore,uHot,uBg,uNoise;
uniform float uTime,uNoiseAmt,uNoiseFps,uNoisePix,uNoiseShape,uGlitch,uGSeed;
uniform vec2 uNoiseLen;
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
/* 静的な粒(hs) + コマごとに変わる粒(hd)。shimmerが大きいほどざわつく */
float grain(vec2 c,float k){
  return fract(h21(c*k+k*3.1)+uShimmer*h21(c*(k*0.7+0.3)+uSeed*k));
}
void main(){
  vec2 frag=vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y);
  vec2 l=(frag-uOffset)/uScale;              /* 論理座標(1200x700系)へ変換 */
  float inv=0.0,solid=0.0;
  if(uGlitch>0.5){
    /* クライマックス: 全体の青⇔オレンジを反転。大小の長方形ブロックが横ずれし、
       ブロック内は反転が戻る（反転/非反転がモザイク状に入り混じる） */
    inv=1.0;
    for(int k=0;k<3;k++){
      float fk=float(k);
      vec2 bs=k==0?vec2(420.0,90.0):(k==1?vec2(160.0,36.0):vec2(60.0,12.0));
      vec2 bid=floor((l+vec2(fk*37.0,fk*19.0))/bs);
      float r=h21(bid+vec2(fk*13.1,uGSeed));
      if(r<0.3){
        l.x+=(h21(bid*1.3+vec2(uGSeed,fk))-0.5)*bs.x*1.2;
        inv=1.0-inv;
        if(k<2&&r<0.07)solid=1.0+step(0.035,r);  /* 大きめの長方形の一部はベタ塗り（1=ノイズ色 2=キーカラー） */
      }
    }
  }
  vec2 cell=floor(l/uPix);                   /* 論理座標に固定した粗いドット */
  vec2 c=(cell+0.5)*uPix;
  float f=0.0,m=0.0,dens=0.0,hr2=uHotR*uHotR;
  for(int i=0;i<${HARD_CAP};i++){
    if(i>=uCount)break;
    vec2 d=c-uBlobs[i].xy;
    float dd=dot(d,d);
    float R=uBlobs[i].z*uMergeK;
    float q=dd/(R*R);
    if(q<1.0){float w=1.0-q;w*=w;f+=w;m=max(m,w);} /* メタボール場（有限半径カーネル）/ m=最寄りblob中心への近さ */
    dens+=exp(-dd/hr2);                      /* 座標の密集度（盛り上がり判定） */
  }
  float n1=grain(cell,1.0),n2=grain(cell,1.7),n3=grain(cell,2.3);
  float v=f/uThresh;                         /* 1.0 = blob輪郭 */
  /* 粒の出現確率: 輪郭(v=1)の内側は必ず埋まり、外側は裾を引いてまばらになる（砂）。
     scatterが大きいほど裾が長い（v^(1/(0.7*scatter))） */
  float p=v>=1.0?1.0:pow(v,1.0/(0.7*uScatter));
  float hot=smoothstep(uHotMin,uHotMax,dens);
  vec3 B=inv>0.5?uHot:uBg, H=inv>0.5?uBg:uHot;   /* クライマックス中は青⇔オレンジ反転 */
  vec3 col=B;
  if(n1<p){
    float t=smoothstep(0.15,0.95,m);                   /* 各blobの出現位置(中心)=緑 → 外側=青。融合部でも中心だけ緑 */
    t+=(grain(cell,3.1)-0.5)*0.35;                     /* 粒ごとの色ゆらぎ（砂の混色感） */
    float tq=clamp(floor(t*uSteps+n2)/uSteps,0.0,1.0);  /* 階調を量子化＋ディザ */
    col=mix(uEdge,uCore,tq);
    if(n3<hot)col=H;
  }else if(n3<hot*uHotSpill)col=H;          /* 盛り上がり周辺に散るオレンジの粒 */
  else{
    /* 背景のグレーノイズ: art.noisePixel 単位のドットを bgNoise の比率だけ点在させる。
       ドットごとに切り替わるタイミングをずらし、一斉に入れ替わらないようにする */
    vec2 nc=floor(l/uNoisePix);
    if(uNoiseShape<0.5){
      /* 0: 正方形のドット */
      float rs=floor(uTime*uNoiseFps+h21(nc+vec2(11.0,5.0)));
      if(h21(nc*0.73+vec2(rs*1.37,rs*0.91))<uNoiseAmt)col=uNoise;
    }else{
      /* 1: 横線（1ドット高の長方形）。行ごとに長さ uNoiseLen(最小〜最大ドット) の線が並び、
         行ごとにずれたタイミングで入れ替わる */
      float row=nc.y;
      float rs=floor(uTime*uNoiseFps+h21(vec2(row,11.0)));
      float segLen=uNoiseLen.x+floor(h21(vec2(row,rs+7.0))*(uNoiseLen.y-uNoiseLen.x+1.0));
      float seg=floor((nc.x+h21(vec2(row,rs+3.0))*64.0)/segLen);
      if(h21(vec2(seg*0.73,row+rs*0.37))<uNoiseAmt)col=uNoise;
    }
  }
  if(solid>1.5)col=uHot;else if(solid>0.5)col=uNoise;
  gl_FragColor=vec4(mix(B,col,uOpacity),1.0);
}`;
  function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.warn('[blob] shader error:',gl.getShaderInfoLog(s));return null}return s}
  const v=sh(gl.VERTEX_SHADER,vs),f=sh(gl.FRAGMENT_SHADER,fs);
  if(!v||!f)return false;
  glProg=gl.createProgram();gl.attachShader(glProg,v);gl.attachShader(glProg,f);gl.linkProgram(glProg);
  if(!gl.getProgramParameter(glProg,gl.LINK_STATUS)){console.warn('[blob] link error:',gl.getProgramInfoLog(glProg));return false}
  gl.useProgram(glProg);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const aP=gl.getAttribLocation(glProg,'aP');gl.enableVertexAttribArray(aP);gl.vertexAttribPointer(aP,2,gl.FLOAT,false,0,0);
  ['uRes','uOffset','uScale','uMergeK','uThresh','uOpacity','uCount','uBlobs','uEdge','uCore','uHot','uBg',
   'uPix','uSteps','uScatter','uShimmer','uSeed','uHotR','uHotMin','uHotMax','uHotSpill',
   'uNoise','uTime','uNoiseAmt','uNoiseFps','uNoisePix','uNoiseShape','uNoiseLen','uGlitch','uGSeed']
    .forEach(n=>glU[n]=gl.getUniformLocation(glProg,n));
  // 固定uniform
  gl.uniform1f(glU.uMergeK,MERGE_K);
  gl.uniform1f(glU.uThresh,THRESH);
  gl.uniform1f(glU.uOpacity,P.opacity);
  gl.uniform3fv(glU.uEdge,css2rgb(ART.edge));
  gl.uniform3fv(glU.uCore,css2rgb(ART.core));
  gl.uniform3fv(glU.uHot,css2rgb(ART.hot));
  gl.uniform3fv(glU.uBg,css2rgb(ART.bg));
  gl.uniform1f(glU.uPix,Math.max(ART.pixel,1));
  gl.uniform1f(glU.uSteps,Math.max(ART.steps,1));
  gl.uniform1f(glU.uScatter,Math.min(Math.max(ART.scatter,0.01),0.99));
  gl.uniform1f(glU.uShimmer,ART.shimmer);
  gl.uniform1f(glU.uHotR,Math.max(ART.hotRadius,1));
  gl.uniform1f(glU.uHotMin,ART.hotMin);
  gl.uniform1f(glU.uHotMax,Math.max(ART.hotMax,ART.hotMin+0.01));
  gl.uniform1f(glU.uHotSpill,ART.hotSpill);
  gl.uniform3fv(glU.uNoise,css2rgb(NOISE_COLOR));
  gl.uniform1f(glU.uNoiseAmt,Math.min(Math.max(ART.bgNoise,0),1));
  // ノイズのドットの大きさ / 切り替え速度（未指定なら pixel / grainFps の1/10）
  gl.uniform1f(glU.uNoisePix,Math.max(ART.noisePixel!=null?ART.noisePixel:ART.pixel,0.5));
  gl.uniform1f(glU.uNoiseShape,ART.bgShape?1:0);   // 0=正方形 / 1=横線
  const nl=Array.isArray(ART.noiseLineLen)?ART.noiseLineLen:[ART.noiseLineLen,ART.noiseLineLen];
  gl.uniform2f(glU.uNoiseLen,Math.max(Math.round(nl[0]),1),Math.max(Math.round(nl[1]),Math.round(nl[0]),1));
  gl.uniform1f(glU.uNoiseFps,Math.max(ART.noiseFps!=null?ART.noiseFps:ART.grainFps/10,0));
  gl.uniform1f(glU.uGlitch,0);
  return true;
}
let vpScale=1,vpOffX=0,vpOffY=0;
function resizeGL(){
  const cw=canvas.clientWidth,ch=canvas.clientHeight;
  if(!cw||!ch)return;
  canvas.width=Math.round(cw*DPR);canvas.height=Math.round(ch*DPR);
  // preserveAspectRatio: slice と同じマッピング
  const s=Math.max(cw/P.w,ch/P.h);
  vpScale=s*DPR;
  vpOffX=(cw-P.w*s)/2*DPR;
  vpOffY=(ch-P.h*s)/2*DPR;
  if(gl){
    gl.viewport(0,0,canvas.width,canvas.height);
    gl.uniform2f(glU.uRes,canvas.width,canvas.height);
    gl.uniform2f(glU.uOffset,vpOffX,vpOffY);
    gl.uniform1f(glU.uScale,vpScale);
  }
}
const blobArr=new Float32Array(HARD_CAP*3);
function drawGL(){
  for(let i=0;i<blobs.length;i++){
    const b=blobs[i];
    blobArr[i*3]=b.x;blobArr[i*3+1]=b.y;blobArr[i*3+2]=b.r;
  }
  gl.uniform1i(glU.uCount,blobs.length);
  const pn=performance.now()/1000;
  gl.uniform1f(glU.uSeed,Math.floor(pn*ART.grainFps)%997+1); // 粒のざわつき（grainFpsで更新）
  gl.uniform1f(glU.uTime,pn%200);                            // 背景ノイズの切り替え
  gl.uniform1f(glU.uGlitch,glitchOn?1:0);
  gl.uniform1f(glU.uGSeed,Math.floor(pn*14)%997+1);          // グリッチ長方形の切り替え（14回/秒）
  gl.uniform3fv(glU.uBlobs,blobArr);
  gl.drawArrays(gl.TRIANGLES,0,3);
}

/* ---------- SVG scaffold（線+HUDのみ。フィルター不使用） ---------- */
svg.setAttribute('viewBox',`0 0 ${P.w} ${P.h}`);
HAS_GL=initGL();
console.info('[blob] renderer:',HAS_GL?'WebGL (GPU)':'SVG fallback');
svg.innerHTML=
  (HAS_GL?'':`<rect width="${P.w}" height="${P.h}" fill="${css2hex(ART.bg)}"/>`
    +`<defs><radialGradient id="grad"><stop offset="0%" stop-color="${css2hex(ART.core)}"/>`
    +`<stop offset="100%" stop-color="${css2hex(ART.edge)}"/></radialGradient></defs>`
    +`<g id="goog" fill="url(#grad)" opacity="${P.opacity}"></g>`)
  +`<g id="lineg"></g><g id="hudg"></g>`;
const gooG=svg.querySelector('#goog'), lineG=svg.querySelector('#lineg'), hudG=svg.querySelector('#hudg');
resizeGL();
window.addEventListener('resize',resizeGL);

/* ---------- 決定論的モーション ---------- */
function mulberry32(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashId(id){let h=2166136261;const s=String(id);for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

/* ---------- blobs ---------- */
let blobs=[], total=0, localSeq=0, displaySeq=0;
function makeBlob(rec,opt){ // rec: {id, cid, x(0..1), y(0..1), r(px)} / opt: {num, front}（飛散からの復帰用）
  const rng=mulberry32(hashId(rec.id));
  const b={
    id:rec.id, cid:rec.cid||null,
    ax:rec.x*P.w, ay:rec.y*P.h, r0:rec.r,
    f1:0.10+rng()*0.22, f2:0.05+rng()*0.14, f3:0.08+rng()*0.2,
    p1:rng()*6.283, p2:rng()*6.283, p3:rng()*6.283, pf:0.5+rng(),
    x:0,y:0,r:rec.r, own:rec.cid===myId,
  };
  b.num=(opt&&opt.num!=null)?opt.num:displaySeq++;
  b.rec=rec;
  if(!HAS_GL){b.cEl=document.createElementNS(SVGNS,'circle');gooG.appendChild(b.cEl)}
  b.hEl=document.createElementNS(SVGNS,'g');
  b.hEl.innerHTML=`<path fill="none"/><circle r="1.6"/><rect rx="1"/><text font-family="Consolas,Menlo,monospace"></text>`;
  hudG.appendChild(b.hEl);
  if(opt&&opt.front){blobs.unshift(b);hudG.insertBefore(b.hEl,hudG.firstChild)}
  else blobs.push(b);
  while(blobs.length>MAX)removeBlob(blobs[0]);
  return b;
}
function removeBlob(b){if(b.cEl)b.cEl.remove();b.hEl.remove();blobs.splice(blobs.indexOf(b),1)}
function clearBlobs(){while(blobs.length)removeBlob(blobs[0]);displaySeq=0}

/* 揺らぎオフセット（posAtと同一式）。タップ位置補正に使用 */
function driftAt(b,t){
  const k=P.speed/25,A=P.speed*1.2,T=t*k;
  return [A*(Math.sin(T*b.f1+b.p1)+0.6*Math.sin(T*b.f3+b.p3)),
          A*(Math.cos(T*b.f2+b.p2)+0.6*Math.cos(T*b.f1*1.3+b.p1*1.7))];
}

/* ラベル番号: k番目（0起点）の印を、HUDバーの Total Marks 表示と同じ基準で表す。
 * countOffset:-1 なら 0起点（最新 = Total Marks 表示と同じ数字）、0 なら 1起点 */
function labelNum(k){return k+1+COUNT_OFFSET}

/* seed blobs（Supabase未接続時・Total Marks=0のときのフォールバック表示） */
function addSeeds(){(CFG.seedBlobs||[]).forEach((s,i)=>makeBlob({id:'seed'+i,cid:null,x:s.x,y:s.y,r:s.r}))}

/* 初期blobを生成（数 = initialBlobs指定時はその値、未指定ならTotal Marks。表示上限 MAX）
 * initialBlobs指定時は一度だけ生成し、Total Marks取得後も作り直さない */
let marksRendered=false;
function renderMarks(n){
  if(INIT_BLOBS!==null){
    if(marksRendered)return;
    n=INIT_BLOBS;
  }
  const count=Math.min(Number(n)||0,MAX);
  if(count<=0)return;
  marksRendered=true;
  const own=blobs.filter(b=>b.own).map(b=>({rec:b.rec,num:b.num}));
  clearBlobs();
  for(let i=0;i<count;i++){
    const k=n-count+i;
    const rng=mulberry32(hashId('mark'+k));
    makeBlob({id:'mark'+k,cid:null,
      x:+(0.08+rng()*0.84).toFixed(4),
      y:+(0.08+rng()*0.84).toFixed(4),
      r:Math.round(P.minR+(P.maxR-P.minR)*rng())},{num:labelNum(k)});
  }
  own.forEach(o=>makeBlob(o.rec,{num:o.num}));
}

/* ---------- 物理（時刻の純関数） ---------- */
function posAt(b,t){
  const d=driftAt(b,t);
  const m=30;
  b.x=Math.min(Math.max(b.ax+d[0],m),P.w-m);
  b.y=Math.min(Math.max(b.ay+d[1],m),P.h-m);
  b.r=b.r0*(1+P.pulse*0.25*Math.sin(t*b.pf+b.p2));
}

/* ============================================================
 * 盛り上がり → クライマックス → 飛散
 *   ・密集度（シェーダーと同じ式）をblob座標で評価し、hotMin以上＝オレンジ箇所のblobを hotBlobs とする
 *   ・hotBlobs が climax.minBlobs 個以上の状態が holdSec 続くとクライマックス（durationSec）
 *   ・終了時、最新 keep 件以外のblobはカットで消え、hideSec 後にカットで戻る（アニメーションなし）
 * ============================================================ */
let hotBlobs=[], hotSince=0, glitchOn=false, glitchUntil=0, lastClimaxEnd=-1e9, hidden=[], hideUntil=0;
const root=document.getElementById('root');

function restoreHidden(){
  const slots=Math.max(MAX-blobs.length,0);
  const back=slots?hidden.slice(-slots):[];
  hidden=[];
  for(let i=back.length-1;i>=0;i--){   // 古い順に先頭へ戻す（最新件は末尾のまま）。元の番号で即座に再表示
    const h=back[i];
    makeBlob(h.rec,{num:h.num,front:true});
  }
}
function updateClimax(now){
  const hr2=ART.hotRadius*ART.hotRadius;
  hotBlobs=[];
  for(const a of blobs){
    let d=0;
    for(const b of blobs){const dx=a.x-b.x,dy=a.y-b.y;d+=Math.exp(-(dx*dx+dy*dy)/hr2)}
    if(d>=ART.hotMin)hotBlobs.push(a);
  }
  if(glitchOn){if(now>=glitchUntil)endClimax(now);return}
  if(hidden.length&&now>=hideUntil)restoreHidden();
  if(!CLX.on)return;
  if(CLX.requireClick&&!clicksUsed){hotSince=0;return}  // 自分がクリックして自分のblobが出るまでは発動しない
  if(hotBlobs.length>=CLX.minBlobs&&now-lastClimaxEnd>CLX.cooldownSec*1000){
    if(!hotSince)hotSince=now;
    if(now-hotSince>=CLX.holdSec*1000)startClimax(now);
  }else hotSince=0;
}
let clxTimer=0;
function startClimax(now){
  glitchOn=true;glitchUntil=now+CLX.durationSec*1000;hotSince=0;
  root.classList.add('climax');
  for(let i=0;i<CLX.letters;i++)placeClimaxLetter(document.createElement('span'));
  clxTimer=setInterval(()=>{            // 点滅しながら位置・サイズも入れ替わる
    const els=letG.querySelectorAll('span.clx');
    els.forEach(el=>{if(Math.random()<0.35)placeClimaxLetter(el)});
  },160);
}
function placeClimaxLetter(s){
  s.className='clx';
  s.textContent=LET.chars[Math.floor(Math.random()*LET.chars.length)];
  s.style.left=(Math.random()*100).toFixed(2)+'%';
  s.style.top=(Math.random()*100).toFixed(2)+'%';
  s.style.fontSize=(3+Math.pow(Math.random(),2)*45).toFixed(1)+'vmin';   // 小さい文字多め＋ときどき巨大
  s.style.fontFamily=LET.font;s.style.fontWeight=LET.weight;
  s.style.color=CLX.letterColors[Math.floor(Math.random()*CLX.letterColors.length)];
  s.style.setProperty('--d',(0.06+Math.random()*0.24).toFixed(2)+'s');
  s.style.setProperty('--dl',(-Math.random()*0.3).toFixed(2)+'s');
  if(!s.parentNode)letG.appendChild(s);
}
function endClimax(now){
  glitchOn=false;lastClimaxEnd=now;
  root.classList.remove('climax');
  clearInterval(clxTimer);
  letG.querySelectorAll('span.clx').forEach(el=>el.remove());
  const gone=blobs.slice(0,Math.max(blobs.length-Math.max(CLX.keep,0),0));  // 最新 keep 件以外
  for(const b of gone){hidden.push({rec:b.rec,num:b.num});removeBlob(b)}
  hideUntil=now+CLX.hideSec*1000;
}

/* ---------- render ---------- */
let linePool=[];
let lastFrame=0;
const FPS=Math.min(Math.max(Number(IS_MOBILE?PERF.mobileFps:PERF.pcFps)||60,1),60);
const FRAME_MS=FPS<60?1000/FPS:0;
function render(now){
  requestAnimationFrame(render);
  if(FRAME_MS){
    const el=now-lastFrame;
    if(el<FRAME_MS-1)return;              // -1ms: vsync揺らぎで1コマ飛ばされるのを防ぐ
    lastFrame+=FRAME_MS*Math.max(1,Math.floor(el/FRAME_MS)); // 固定間隔で進め、指定fpsどおりを維持
    if(now-lastFrame>FRAME_MS)lastFrame=now;                 // タブ復帰などで大きく遅れたら再同期
  }
  const t=Date.now()/1000;
  for(const b of blobs)posAt(b,t);
  updateClimax(now);
  // グーイ本体
  if(HAS_GL)drawGL();
  else for(const b of blobs){
    b.cEl.setAttribute('cx',b.x.toFixed(1));
    b.cEl.setAttribute('cy',b.y.toFixed(1));
    b.cEl.setAttribute('r',Math.max(b.r,0.1).toFixed(1));
  }
  // 接続線（近距離plexus）
  let li=0;
  if(P.lnOn){
    for(let i=0;i<blobs.length;i++)for(let j=i+1;j<blobs.length;j++){
      const A=blobs[i],B=blobs[j];
      const d=Math.hypot(A.x-B.x,A.y-B.y);
      if(d>P.lnDist)continue;
      let ln=linePool[li];
      if(!ln){ln=document.createElementNS(SVGNS,'line');linePool.push(ln);lineG.appendChild(ln)}
      ln.setAttribute('x1',A.x.toFixed(1));ln.setAttribute('y1',A.y.toFixed(1));
      ln.setAttribute('x2',B.x.toFixed(1));ln.setAttribute('y2',B.y.toFixed(1));
      ln.setAttribute('stroke',P.lnC);ln.setAttribute('stroke-width',P.lnW);
      ln.setAttribute('stroke-opacity',(P.lnA*(1-d/P.lnDist)).toFixed(3));
      ln.style.display='';
      li++;
    }
  }
  for(let k2=li;k2<linePool.length;k2++)linePool[k2].style.display='none';
  // トラッキングHUD
  const s=P.hudSize, cr=Math.max(5,s*0.55);
  for(const b of blobs){
    const g=b.hEl;
    g.setAttribute('transform',`translate(${b.x.toFixed(1)},${b.y.toFixed(1)})`);
    const [cross,dot,box,lbl]=g.children;
    if(P.hudMarker){
      cross.setAttribute('d',`M${-cr} 0H${cr}M0 ${-cr}V${cr}`);
      cross.setAttribute('stroke',b.own?SEL.bg:P.hudC);cross.setAttribute('stroke-width',b.own?1.5:1);
      dot.setAttribute('fill',b.own?SEL.bg:P.hudC);
      cross.style.display='';dot.style.display='';
    }else{cross.style.display='none';dot.style.display='none'}
    if(P.hudCoords||P.hudId){
      const id=P.hudId?('#'+String(b.num).padStart(2,'0')):'';
      const co=P.hudCoords?` ${Math.round(b.x)},${Math.round(b.y)}`:'';
      lbl.textContent=(id+co).trim();
      lbl.setAttribute('x',cr+4);lbl.setAttribute('y',-cr-3);
      lbl.setAttribute('font-size',s);
      lbl.style.display='';
      if(b.own){
        lbl.setAttribute('fill',SEL.text);
        const w=lbl.getComputedTextLength();
        box.setAttribute('x',cr+1);box.setAttribute('y',-cr-3-s*0.85);
        box.setAttribute('width',w+6);box.setAttribute('height',s*1.15);
        box.setAttribute('fill',SEL.bg);box.style.display='';
      }else{lbl.setAttribute('fill',P.hudC);box.style.display='none'}
    }else{lbl.style.display='none';box.style.display='none'}
  }
}

/* ---------- HUDバー ---------- */
const COUNT_OFFSET=('countOffset' in CFG)?CFG.countOffset:-1;
function updateHud(){
  if(!CFG.counter)return;
  bar.style.display='';
  barL.textContent=(CFG.captionLeft||'Total Marks:')+'\n# '+Math.max(total+COUNT_OFFSET,0).toLocaleString('en-US');
  barR.textContent=CFG.captionRight||"Let's click/tap\nto leave your mark";
}

/* ============================================================
 * Supabase リアルタイム連携（変更なし）
 * ============================================================ */
let sb=null, channel=null, live=false;
const API_TIMEOUT=4000;
function withTimeout(p,ms){
  return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);
}
function validRec(p){
  return p&&typeof p.x==='number'&&p.x>=0&&p.x<=1
    &&typeof p.y==='number'&&p.y>=0&&p.y<=1
    &&typeof p.r==='number'&&p.r>=1&&p.r<=500
    &&typeof p.id==='string'&&p.id.length<=80;
}

function initSupabase(){
  const su=CFG.supabase||{};
  const url=(su.projectUrl||'').trim(), key=(su.anonKey||'').trim();
  if(!url||!key){console.info('[blob] Supabase未設定 → ローカルモードで起動');return}
  if(!window.supabase||!window.supabase.createClient){
    console.warn('[blob] supabase-js CDNの読み込みに失敗 → ローカルモード');return}
  try{
    sb=window.supabase.createClient(url,key);
  }catch(e){console.warn('[blob] Supabase初期化失敗 → ローカルモード',e);sb=null;return}

  withTimeout(
    sb.from('global_marks').select('*').eq('id',1).single(),
    API_TIMEOUT
  ).then(({data,error})=>{
    if(error)throw error;
    const c=Number(data&&data.count);
    if(isFinite(c)&&c>=0){
      total=Math.max(total,c);
      renderMarks(total);
      updateHud();
    }else{
      console.warn('[blob] global_marksの応答にcount列が見つかりません:',data);
    }
  }).catch(e=>{
    console.warn('[blob] Total Marks取得失敗 → ローカル値を起点に継続',e&&e.message);
  });

  const rxLast=new Map();
  try{
    channel=sb.channel('blob-network',{config:{broadcast:{self:false}}});
    channel.on('broadcast',{event:'spawn'},msg=>{
      try{
        const p=(msg&&msg.payload)||{};
        if(!validRec(p))return;
        const now=Date.now(), cid=String(p.cid||'?');
        if(now-(rxLast.get(cid)||0)<250)return;
        rxLast.set(cid,now);
        makeBlob({id:p.id,cid:p.cid,x:p.x,y:p.y,r:p.r},{num:labelNum(total)});
        total++;updateHud();
      }catch(e){console.warn('[blob] broadcast受信処理エラー',e)}
    });
    channel.subscribe(status=>{
      if(status==='SUBSCRIBED'){
        if(!live)console.info('[blob] Supabase Realtime 接続');
        live=true;
      }else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){
        if(live)console.warn('[blob] Realtime切断 → ローカルモードにフォールバック（自動再接続待ち）');
        live=false;
      }
    });
  }catch(e){console.warn('[blob] Realtimeチャンネル作成失敗 → ローカルモード',e);channel=null;live=false}
}

/* ---------- クリックでblob追加 ---------- */
let clicksUsed=0, lastClickAt=0;
const CLICK_LIMIT=('clickLimit' in CFG)?CFG.clickLimit:1;
const THROTTLE_MS=300;
svg.addEventListener('click',e=>{
  if(CLICK_LIMIT&&clicksUsed>=CLICK_LIMIT)return;
  const now=Date.now();
  if(now-lastClickAt<THROTTLE_MS)return;
  lastClickAt=now;
  const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
  const ctm=svg.getScreenCTM();if(!ctm)return;
  const p=pt.matrixTransform(ctm.inverse());
  if(p.x<0||p.y<0||p.x>P.w||p.y>P.h)return;
  const id='b'+hashId(myId).toString(36)+'-'+now.toString(36)+'-'+(localSeq++);
  /* タップ位置補正: 現在時刻の揺らぎを逆算してアンカーから差し引き、
   * タップ地点に正確に出現させる（揺らぎはidと時刻の純関数なので全ユーザーで一貫） */
  const tmp={};
  {
    const rng=mulberry32(hashId(id));
    tmp.f1=0.10+rng()*0.22;tmp.f2=0.05+rng()*0.14;tmp.f3=0.08+rng()*0.2;
    tmp.p1=rng()*6.283;tmp.p2=rng()*6.283;tmp.p3=rng()*6.283;
  }
  const dv=driftAt(tmp,now/1000);
  const ax=Math.min(Math.max(p.x-dv[0],30),P.w-30);
  const ay=Math.min(Math.max(p.y-dv[1],30),P.h-30);
  const rec={
    id:id,
    cid:myId,
    x:+(ax/P.w).toFixed(4), y:+(ay/P.h).toFixed(4),
    r:Math.round(P.minR+Math.random()*(P.maxR-P.minR)),
  };
  clicksUsed++;
  if(CLICK_LIMIT&&clicksUsed>=CLICK_LIMIT)svg.classList.add('used');
  makeBlob(rec,{num:labelNum(total)});   // 仮の番号（ローカルの累計から）
  total++;updateHud();
  if(live&&channel){
    try{
      Promise.resolve(channel.send({type:'broadcast',event:'spawn',payload:rec}))
        .then(res=>{if(res!=='ok')console.warn('[blob] broadcast送信失敗:',res)})
        .catch(e=>console.warn('[blob] broadcast送信エラー',e));
    }catch(e){console.warn('[blob] broadcast送信例外',e)}
  }
  if(sb){
    withTimeout(sb.rpc('increment_mark'),API_TIMEOUT).then(({data,error})=>{
      if(error)throw error;
      const c=Number(data);
      if(isFinite(c)&&c>0){
        total=Math.max(total,c);
        const mine=blobs.find(x=>x.id===rec.id);   // renderMarksで作り直されていても id で探す
        if(mine)mine.num=labelNum(c-1);            // DBで確定した通し番号に補正（自分はc番目の印）
        if(!marksRendered)renderMarks(Math.max(total-1,0));
        updateHud();
      }
    }).catch(e=>{
      console.warn('[blob] increment_mark失敗 → ローカルカウントで継続',e&&e.message);
    });
  }
});

/* ---------- 別レイヤー: V/Y/N/E のランダム文字 ----------
 * 同期はしない（各閲覧者のローカル演出）。フェードせずパッと出てパッと消える（コマ送り感） */
const letG=document.getElementById('letters');
function rnd(a){return Array.isArray(a)?a[0]+Math.random()*(a[1]-a[0]):+a}
let nLet=0,nHot=0;
function spawnLetter(){
  if(!document.hidden&&nLet<LET.max&&LET.chars.length){
    const s=document.createElement('span');
    s.textContent=LET.chars[Math.floor(Math.random()*LET.chars.length)];
    s.style.left=(6+Math.random()*88).toFixed(2)+'%';
    s.style.top=(8+Math.random()*76).toFixed(2)+'%';   // 下部HUDバーを避ける
    s.style.color=LET.color;s.style.fontFamily=LET.font;s.style.fontSize=LET.size;s.style.fontWeight=LET.weight;
    letG.appendChild(s);nLet++;
    setTimeout(()=>{s.remove();nLet--},rnd(LET.life)*1000);
  }
  setTimeout(spawnLetter,rnd(LET.interval)*1000);
}
if(LET.on)spawnLetter();

/* 盛り上がり（オレンジ箇所）の文字: hotBlobs の周辺に短い寿命で高速に出る。
 * オレンジ箇所のblobが多いほど出現間隔が短くなる */
function spawnHotLetter(){
  let wait=rnd(HLET.interval);
  if(!document.hidden&&!glitchOn&&hotBlobs.length&&nHot<HLET.max&&LET.chars.length){
    const b=hotBlobs[Math.floor(Math.random()*hotBlobs.length)];
    const s0=vpScale/DPR, R=ART.hotRadius;
    const lx=b.x+(Math.random()-0.5)*2*R, ly=b.y+(Math.random()-0.5)*2*R;
    const s=document.createElement('span');
    s.textContent=LET.chars[Math.floor(Math.random()*LET.chars.length)];
    s.style.left=(lx*s0+vpOffX/DPR).toFixed(1)+'px';
    s.style.top=(ly*s0+vpOffY/DPR).toFixed(1)+'px';
    s.style.color=LET.color;s.style.fontFamily=LET.font;s.style.fontSize=LET.size;s.style.fontWeight=LET.weight;
    letG.appendChild(s);nHot++;
    setTimeout(()=>{s.remove();nHot--},rnd(HLET.life)*1000);
    wait/=1+hotBlobs.length*0.15;
  }
  setTimeout(spawnHotLetter,Math.max(wait,0.016)*1000);
}
if(LET.on&&HLET.on)spawnHotLetter();

/* ---------- init ---------- */
if(INIT_BLOBS!==null&&INIT_BLOBS>0)renderMarks(INIT_BLOBS);else addSeeds();
updateHud();
initSupabase();
requestAnimationFrame(render);
</script>
</body>
